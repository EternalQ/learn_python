[project]
name = "marketlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EternalQ", email = "dptuha1406@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.16.2",
]

[project.scripts]
marketlens = "marketlens.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
