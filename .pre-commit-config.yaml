repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
        alias: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (local uv environment)
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]
